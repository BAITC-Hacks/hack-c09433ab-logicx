<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Тёмный фон со скруглёнными углами -->
  <rect width="64" height="64" rx="16" fill="#0F172A"/>
  
  <!-- Геометрическое облако из полигонов -->
  <g transform="translate(4, 4)">
    <!-- Левая нижняя часть -->
    <polygon points="12,38 24,38 18,28" fill="#6366F1"/>
    <!-- Центральная базовая часть -->
    <polygon points="24,38 40,38 32,24" fill="#818CF8"/>
    <!-- Правая часть -->
    <polygon points="40,38 48,38 44,30" fill="#4F46E5"/>
    <!-- Верхний купол (вершина облака) -->
    <polygon points="18,28 32,24 26,14" fill="#38BDF8"/>
    <polygon points="32,24 44,30 38,16" fill="#818CF8"/>
    <polygon points="26,14 38,16 32,24" fill="#C084FC"/>
  </g>
</svg>
